<!DOCTYPE html>
<html>
<head>
  <title>Register</title>
</head>
<body>
  <h2>Register</h2>
  <form id="registerForm">
    <input id="name" placeholder="Name" required /><br>
    <input id="lastName" placeholder="Last Name" required /><br>
    <input id="email" type="email" placeholder="Email" required /><br>
    <input id="username" placeholder="Username" required /><br>
    <input id="password" type="password" placeholder="Password" required /><br>
    <button id="submitBtn" disabled>Register</button>
  </form>

  <p id="message"></p>

  <script>
    const form = document.getElementById("registerForm");
    const inputs = form.querySelectorAll("input");
    const submitBtn = document.getElementById("submitBtn");
    const message = document.getElementById("message");

    // Enable submit if all inputs filled
    inputs.forEach(input => {
      input.addEventListener("input", () => {
        submitBtn.disabled = [...inputs].some(i => !i.value.trim());
      });
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      message.textContent = "";

      const user = {
        name: document.getElementById("name").value.trim(),
        lastName: document.getElementById("lastName").value.trim(),
        email: document.getElementById("email").value.trim(),
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value.trim(),
      };

      try {
        const res = await fetch("/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(user),
        });

        const text = await res.text();
        message.textContent = text;
        if (res.ok) {
          form.reset();
          submitBtn.disabled = true;
        }
      } catch (err) {
        message.textContent = "Failed to register.";
      }
    });
  </script>
</body>
</html>
